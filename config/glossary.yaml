# জীববিজ্ঞান (biobangla) — বৈজ্ঞানিক পরিভাষা অভিধান (Scientific Terminology Glossary)
# বাংলা বৈজ্ঞানিক সাংবাদিকতায় প্রমিত বাংলা পরিভাষা এবং অপরিবর্তনীয় ইংরেজি প্রতীকের নির্দেশিকা।

version: "1.0"

preservation_rules:
  preserve_exact_latin_binomials: true
  preserve_gene_and_protein_symbols: true
  preserve_doi_and_identifiers: true
  first_mention_format: "বাংলা পরিভাষা (English Scientific Term)"

immutable_symbols:
  - "DNA"
  - "RNA"
  - "mRNA"
  - "tRNA"
  - "rRNA"
  - "siRNA"
  - "miRNA"
  - "CRISPR"
  - "CRISPR-Cas9"
  - "Cas9"
  - "Cas12"
  - "Cas13"
  - "PCR"
  - "RT-qPCR"
  - "ATP"
  - "NADPH"
  - "MHC"
  - "CAR-T"
  - "IgG"
  - "IgA"
  - "IgM"
  - "CD4+"
  - "CD8+"
  - "p53"
  - "BRCA1"
  - "ACE2"
  - "DOI"
  - "PMID"

terms:
  - en: "peer review"
    bn: "পিয়ার-রিভিউ (সমকক্ষ বিজ্ঞানীদের মূল্যায়ন)"
    usage_note: "গবেষণা প্রবন্ধ স্বাধীন বিশেষজ্ঞদের দ্বারা যাচাইকৃত কি না তা স্পষ্ট করতে ব্যবহৃত হবে।"

  - en: "preprint"
    bn: "প্রিপ্রিন্ট (পিয়ার-রিভিউ-পূর্ব খসড়া গবেষণা)"
    usage_note: "প্রিপ্রিন্ট কখনোই চূড়ান্ত পিয়ার-রিভিউকৃত গবেষণা হিসেবে উপস্থাপন করা যাবে না।"

  - en: "genome sequencing"
    bn: "জিনোম সিকোয়েন্সিং (পূর্ণাঙ্গ জীবনরহস্য বা জিনগত অনুক্রম নির্ণয়)"
    usage_note: "প্রথমবার ব্যাখ্যাসহ এবং পরে সংক্ষেপে 'জিনোম সিকোয়েন্সিং' লেখা যাবে।"

  - en: "gene editing"
    bn: "জিন সম্পাদনা"
    usage_note: "CRISPR-Cas9 বা সমজাতীয় প্রযুক্তির ক্ষেত্রে ব্যবহৃত।"

  - en: "epigenetics"
    bn: "এপিজেনেটিক্স (জিনোমের অনুক্রম অপরিবর্তিত রেখে জিন প্রকাশের নিয়ন্ত্রণ)"
    usage_note: "ডিএনএ মিউটেশন ও এপিজেনেটিক পরিবর্তনের পার্থক্য স্পষ্ট রাখতে হবে।"

  - en: "microbiome"
    bn: "মাইক্রোবায়োম (অণুজীবসমষ্টি)"
    usage_note: "মানব অন্ত্র, ত্বক বা মাটির সহাবস্থানকারী অণুজীবদের সমষ্টি বোঝাতে।"

  - en: "in vitro"
    bn: "ইন ভিট্রো (গবেষণাগারের পাত্রে বা কোষ কালচারে পরীক্ষিত)"
    usage_note: "মানবদেহে ক্লিনিক্যাল ফলাফলের সাথে গুলিয়ে ফেলা যাবে না।"

  - en: "in vivo"
    bn: "ইন ভিভো (জীবদেহের অভ্যন্তরে পরীক্ষিত)"
    usage_note: "কোন প্রাণী মডেলে (যেমন ইঁদুর বা জেব্রাফিশ) পরীক্ষা হয়েছে তা উল্লেখ করতে হবে।"

  - en: "clinical trial"
    bn: "ক্লিনিক্যাল ট্রায়াল (মানবদেহে নিয়ন্ত্রিত চিকিৎসা গবেষণা)"
    usage_note: "ট্রায়ালের ধাপ (Phase I/II/III) এবং অংশগ্রহণকারীর সংখ্যা উল্লেখ করা বাঞ্ছনীয়।"

  - en: "randomized controlled trial"
    bn: "র‍্যান্ডমাইজড কন্ট্রোলড ট্রায়াল (দৈবচয়নভিত্তিক নিয়ন্ত্রিত পরীক্ষা)"
    usage_note: "কার্যকারণ সম্পর্ক যাচাইয়ের উচ্চমানের পদ্ধতি।"

  - en: "correlation"
    bn: "সহসম্পর্ক (Correlation)"
    usage_note: "সহসম্পর্ক মানেই কার্যকারণ (Causation) নয়—এটি স্পষ্টভাবে উল্লেখ করতে হবে।"

  - en: "causation"
    bn: "কার্যকারণ সম্পর্ক (Causation)"
    usage_note: "কেবল পরীক্ষামূলক প্রমাণের ভিত্তিতে কার্যকারণ দাবি করা যাবে।"

  - en: "statistical significance"
    bn: "পরিসংখ্যানগত তাৎপর্য"
    usage_note: "পরিসংখ্যানগত তাৎপর্য এবং বাস্তব ক্লিনিক্যাল গুরুত্ব এক নয়।"

  - en: "antibody"
    bn: "অ্যান্টিবডি (প্রতিরক্ষামূলক প্রোটিন)"
    usage_note: "রোগপ্রতিরোধবিদ্যার প্রবন্ধে ব্যবহৃত।"

  - en: "antigen"
    bn: "অ্যান্টিজেন"
    usage_note: "রোগপ্রতিরোধ প্রতিক্রিয়া উদ্দীপক অণু।"

  - en: "cytokine"
    bn: "সাইটোকাইন (কোষীয় বার্তাবাহক প্রোটিন)"
    usage_note: "প্রদাহ ও প্রতিরক্ষা সংকেত বোঝাতে।"

  - en: "biodiversity"
    bn: "জীববৈচিত্র্য"
    usage_note: "প্রজাতিগত, জিনগত ও বাস্তুতান্ত্রিক বৈচিত্র্য।"

  - en: "phylogeny"
    bn: "ফাইলোজেনি (বিবর্তনীয় আত্মীয়তার বৃক্ষ)"
    usage_note: "বিবর্তন জীববিজ্ঞানে প্রজাতির সম্পর্ক বোঝাতে।"

  - en: "photosynthesis"
    bn: "সালোকসংশ্লেষণ"
    usage_note: "উদ্ভিদ ও শৈবালের আলোকশক্তি রূপান্তর প্রক্রিয়া।"

  - en: "antibiotic resistance"
    bn: "অ্যান্টিবায়োটিক রেজিস্ট্যান্স (ওষুধ-প্রতিরোধী সক্ষমতা)"
    usage_note: "অণুজীববিজ্ঞানের জনস্বাস্থ্য প্রাসঙ্গিকতা ব্যাখ্যায়।"
