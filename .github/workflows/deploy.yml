name: "৩. ওয়েবসাইট বিল্ড ও GitHub Pages ডিপ্লয়মেন্ট (Deploy Site)"

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "content/**"
      - "public/**"
      - "config/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  schedule:
    # Daily scheduled build ensures articles committed by GITHUB_TOKEN in process.yml are published cleanly without recursive push loops
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: biobangla-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: "Build Astro Site, Pagefind Index & Verify Links"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure GitHub Pages metadata
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck & validate Astro content schemas
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run check

      - name: Build production static site & Pagefind search index
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin || 'https://biobangla.org' }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path || '/' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  deploy:
    name: "Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
