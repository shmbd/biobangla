name: "১. গবেষণা মেটাডেটা সংগ্রহ (Collect Research)"

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:
    inputs:
      max_per_source:
        description: "প্রতি উৎস থেকে সর্বোচ্চ সংগৃহীত প্রবন্ধ সংখ্যা"
        required: false
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: biobangla-content-pipeline
  cancel-in-progress: false

jobs:
  collect:
    name: "Collect & Deduplicate Open Biology Metadata"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run modular research collectors
        env:
          PIPELINE_CONTACT_EMAIL: ${{ secrets.PIPELINE_CONTACT_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PLOS_API_KEY: ${{ secrets.PLOS_API_KEY }}
          MAX_CANDIDATES_PER_RUN: ${{ inputs.max_per_source || '10' }}
        run: python scripts/run_collect.py --max-per-source "${MAX_CANDIDATES_PER_RUN}"

      - name: Upload collection logs & report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collection-logs-${{ github.run_id }}
          path: |
            state/candidates/latest_candidates.json
            state/logs/collection_log.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Safely commit candidate queue updates
        run: |
          git config user.name "biobangla-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/candidates/latest_candidates.json state/logs/collection_log.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new research candidates to commit."
            exit 0
          fi
          git commit -m "chore(collect): update standardized research candidates [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
