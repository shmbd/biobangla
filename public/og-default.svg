  <text x="96" y="160" font-family="'Noto Sans Bengali', sans-serif" font-size="22" font-weight="600" fill="#0F766E" letter-spacing="2">BIOBANGLA • বিজ্ঞান সাময়িকী</text>
  <text x="96" y="275" font-family="'Noto Sans Bengali', sans-serif" font-size="84" font-weight="700" fill="#0B1F3A">জীববিজ্ঞান</text>
