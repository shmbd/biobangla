  <text x="96" y="450" font-family="'Noto Sans Bengali', sans-serif" font-size="24" fill="#475569">অণুজীববিজ্ঞান • জিনতত্ত্ব • চিকিৎসা জীববিজ্ঞান • পরিবেশ ও বিবর্তন</text>
  <text x="96" y="535" font-family="system-ui, sans-serif" font-size="20" fill="#64748B">অলাভজনক শিক্ষামূলক বিজ্ঞান সাংবাদিকতা প্ল্যাটফর্ম</text>
